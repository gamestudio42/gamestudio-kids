<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Game Studio Kids</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffec27">
  <meta name="description" content="Crie jogos 2D com seus próprios desenhos em pixel art. Para crianças a partir de 5 anos.">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-apple.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GS Kids">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Tela inicial -->
  <main id="home" class="screen">
    <div class="home-top">
      <h1 class="logo">🎮 Game Studio <span>Kids</span></h1>
      <button id="mode-toggle-home" class="chip" type="button"></button>
    </div>

    <section class="home-new">
      <h2>✨ <span class="label">Novo jogo</span></h2>
      <div id="worlds" class="worlds">
        <button class="world" data-world="nuvem" type="button" title="Mundo Nuvem"><canvas width="16" height="16"></canvas><span class="label">Nuvem</span></button>
        <button class="world" data-world="bosque" type="button" title="Mundo Bosque"><canvas width="16" height="16"></canvas><span class="label">Bosque</span></button>
        <button class="world" data-world="noite" type="button" title="Mundo Noite"><canvas width="16" height="16"></canvas><span class="label">Noite</span></button>
        <button id="btn-new" class="world blank" type="button" title="Começar do zero"><span class="world-blank">✏️</span><span class="label">Do zero</span></button>
      </div>
      <label class="tour-check">
        <input id="chk-tour" type="checkbox" checked>
        <span>🧭 <span class="label">Começar com o tour</span></span>
      </label>
    </section>

    <section id="backup" class="backup" hidden>
      <span class="backup-icon">💾</span>
      <span class="backup-text">Guarde uma cópia dos seus jogos. Se o navegador for limpo, eles continuam com você.</span>
      <button id="btn-backup" class="chip green" type="button" title="Guardar uma cópia de todos os jogos">💾 <span class="label">Guardar cópia</span></button>
      <button id="btn-backup-later" class="chip" type="button" title="Agora não">⏰ <span class="label">Depois</span></button>
    </section>

    <section class="home-list">
      <h2>📂 <span class="label">Meus jogos</span></h2>
      <div id="project-list" class="project-list"></div>
      <p id="project-empty" class="muted">Você ainda não tem jogos. Toque em ✨ para começar!</p>
    </section>

    <footer class="home-footer">
      <label class="chip">📥 Importar jogo (.gsk)
        <input id="file-import" type="file" accept=".gsk,application/json" hidden>
      </label>
      <button id="btn-share" class="chip" type="button" title="Mostrar o endereço em QR">📱 <span class="label">Passar o endereço</span></button>
      <button id="btn-install" class="chip" type="button" hidden>📲 Instalar no aparelho</button>
      <p id="install-hint" class="muted install-hint" hidden></p>
    </footer>
  </main>

  <!-- Estúdio -->
  <div id="studio" class="screen" hidden>
    <header class="studio-bar">
      <button id="btn-home" class="icon-btn" type="button" title="Início">🏠</button>
      <button id="project-name" class="project-name" type="button" title="Mudar o nome"></button>
      <nav class="tabs" role="tablist">
        <button id="tab-desenhar" class="tab" data-tab="desenhar" type="button" title="Desenhar">🎨 <span class="label">Desenhar</span></button>
        <button id="tab-montar" class="tab" data-tab="montar" type="button" title="Montar">🧱 <span class="label">Montar</span></button>
        <button id="tab-jogar" class="tab play" data-tab="jogar" type="button" title="Jogar">▶️ <span class="label">Jogar</span></button>
      </nav>
      <div class="bar-right">
        <button id="btn-share-studio" class="icon-btn" type="button" title="Mostrar o endereço em QR" aria-label="Mostrar o endereço em QR">📱</button>
        <button id="btn-tour" class="icon-btn" type="button" title="Tour">❓</button>
        <button id="music-toggle" class="icon-btn" type="button" title="Música"></button>
        <button id="mode-toggle" class="icon-btn" type="button"></button>
      </div>
    </header>

    <!-- Desenhar -->
    <section id="view-desenhar" class="view" hidden>
      <aside class="tools">
        <div class="tool-group" id="tool-buttons">
          <button class="tool" data-tool="lapis" type="button" title="Lápis">✏️ <span class="label">Lápis</span></button>
          <button class="tool" data-tool="borracha" type="button" title="Borracha">🧽 <span class="label">Borracha</span></button>
          <button class="tool" data-tool="balde" type="button" title="Balde">🪣 <span class="label">Balde</span></button>
          <button class="tool" data-tool="conta" type="button" title="Conta-gotas">💧 <span class="label">Pegar cor</span></button>
        </div>
        <div class="tool-group">
          <button id="btn-mirror" class="tool" type="button" title="Espelho">🪞 <span class="label">Espelho</span></button>
          <button id="btn-undo" class="tool" type="button" title="Desfazer">↩️ <span class="label">Desfazer</span></button>
          <button id="btn-clear" class="tool" type="button" title="Limpar">🗑️ <span class="label">Limpar</span></button>
        </div>
      </aside>
      <div class="pixel-main">
        <div id="pixel-stage" class="pixel-stage">
          <canvas id="pixel-canvas" width="384" height="384"></canvas>
        </div>
        <div id="palette" class="palette"></div>
      </div>
      <aside class="drawer">
        <div class="preview-box">
          <canvas id="pixel-preview" width="64" height="64"></canvas>
          <div id="sprite-kind" class="sprite-kind"></div>
        </div>
        <div id="frame-tabs" class="frame-tabs" hidden></div>
        <h3>📦 <span class="label">Caixa de desenhos</span></h3>
        <div id="sprite-list" class="sprite-list"></div>
        <button id="btn-new-sprite" class="big-btn small" type="button">➕ <span class="label">Novo desenho</span></button>
        <div id="kind-picker" class="kind-picker" hidden></div>
        <button id="btn-del-sprite" class="chip danger" type="button">🗑️ <span class="label">Apagar desenho</span></button>
      </aside>
    </section>

    <!-- Montar -->
    <section id="view-montar" class="view" hidden>
      <aside id="level-palette" class="level-palette"></aside>
      <div class="level-main">
        <div id="level-scroll" class="level-scroll">
          <canvas id="level-canvas"></canvas>
        </div>
        <div class="level-actions">
          <button id="btn-scroll-left" class="chip" type="button" title="Ver à esquerda">⬅️</button>
          <button id="btn-scroll-right" class="chip" type="button" title="Ver à direita">➡️</button>
          <button id="btn-level-undo" class="chip" type="button" title="Desfazer">↩️ <span class="label">Desfazer</span></button>
          <button id="btn-level-redo" class="chip" type="button" title="Refazer">↪️ <span class="label">Refazer</span></button>
          <button id="btn-fill-ground" class="chip" type="button">🪄 <span class="label">Encher o chão</span></button>
          <button id="btn-clear-level" class="chip danger" type="button">🗑️ <span class="label">Limpar fase</span></button>
        </div>
      </div>
    </section>

    <!-- Jogar -->
    <section id="view-jogar" class="view" hidden>
      <div class="play-wrap">
        <div class="play-top">
          <button id="btn-play-back" class="chip play-back" type="button" title="Voltar">⬅️ Voltar</button>
          <div class="hud"><span id="hud-coins">⭐ 0</span></div>
        </div>
        <div class="play-stage">
          <canvas id="game-canvas" width="256" height="192"></canvas>
          <div id="play-msg" class="play-msg" hidden></div>
        </div>
        <div class="touch-controls">
          <div class="pad">
            <button class="pad-btn" data-key="left" type="button">◀️</button>
            <button class="pad-btn" data-key="right" type="button">▶️</button>
          </div>
          <button class="pad-btn jump" data-key="jump" type="button">⬆️</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Tour -->
  <div id="tour" hidden>
    <div id="tour-ring"></div>
    <div id="tour-hand">👆</div>
    <div id="tour-panel">
      <div class="mascot" aria-hidden="true">
        <canvas id="mascot-canvas" width="16" height="16"></canvas>
      </div>
      <div class="tour-body">
        <p id="tour-text"></p>
        <div class="tour-buttons">
          <button id="tour-speak" class="chip" type="button" title="Ouvir de novo">🔊</button>
          <button id="tour-next" class="chip green" type="button" hidden>👍 Continuar</button>
          <button id="tour-skip" class="chip" type="button">⏭️ Pular tour</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="share" class="ask" hidden>
    <div class="ask-box share-box" role="dialog" aria-modal="true" aria-labelledby="share-text">
      <p id="share-text"></p>
      <canvas id="share-qr" hidden></canvas>
      <p id="share-url" class="share-url"></p>
      <div class="share-actions">
        <button id="share-send" class="chip green" type="button" hidden>📤 <span class="label">Enviar link</span></button>
        <button id="share-close" class="chip" type="button">Fechar</button>
      </div>
    </div>
  </div>

  <!-- Pergunta com ícones (sim / não), lida em voz alta -->
  <div id="ask" class="ask" hidden>
    <div class="ask-box" role="dialog" aria-modal="true" aria-labelledby="ask-text">
      <div id="ask-icon" class="ask-icon"></div>
      <p id="ask-text"></p>
      <div class="ask-buttons">
        <button id="ask-yes" class="ask-btn yes" type="button" title="Sim">✅</button>
        <button id="ask-no" class="ask-btn no" type="button" title="Não">❌</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/pixel-editor.js"></script>
  <script src="js/level-editor.js"></script>
  <script src="js/game.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/qr.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
